on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and native build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch LibRaw
        run: |
          git clone --depth 1 https://github.com/LibRaw/LibRaw.git DarkroomRAW/app/src/main/cpp/third_party/LibRaw
          python - <<'PY'
          from pathlib import Path

          path = Path("DarkroomRAW/app/src/main/cpp/third_party/LibRaw/src/decoders/crx.cpp")
          text = path.read_text()

          old = "\n".join([
              "#ifdef LIBRAW_USE_OPENMP",
              "  int results[4] ={0,0,0,0}; // nPlanes is always <= 4",
              "#pragma omp parallel for",
              "  for (int32_t plane = 0; plane < nPlanes && plane < 4; ++plane)",
              "   try {",
              "    results[plane] = crxDecodePlane(img, plane);",
              "   } catch (...) {",
              "    results[plane] = 1;",
              "   }",
              "",
              "  for (int32_t plane = 0; plane < nPlanes; ++plane)",
              "    if (results[plane])",
              "      derror();",
              "#else",
          ])

          new = "\n".join([
              "#ifdef LIBRAW_USE_OPENMP",
              "  int results[4] ={0,0,0,0}; // nPlanes is always <= 4",
              "  const int32_t planeLimit = nPlanes < 4 ? nPlanes : 4;",
              "#pragma omp parallel for",
              "  for (int32_t plane = 0; plane < planeLimit; ++plane)",
              "   try {",
              "    results[plane] = crxDecodePlane(img, plane);",
              "   } catch (...) {",
              "    results[plane] = 1;",
              "   }",
              "",
              "  for (int32_t plane = 0; plane < nPlanes; ++plane)",
              "    if (results[plane])",
              "      derror();",
              "#else",
          ])

          if old not in text:
              raise SystemExit("Expected LibRaw OpenMP loop not found in crx.cpp")

          path.write_text(text.replace(old, new))
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p DarkroomRAW :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkroomRAW-debug-apk
          path: DarkroomRAW/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
